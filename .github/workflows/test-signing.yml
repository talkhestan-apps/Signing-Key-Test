
name: Test Organization Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-signing:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: Organization keystore secret is empty or unavailable."
            exit 1
          }

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing-key.p12"

          test -s "$RUNNER_TEMP/signing-key.p12"

          echo "Keystore decoded successfully."

      - name: Detect keystore format
        env:
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set +e

          if [ -z "$STORE_PASS" ]; then
            echo "ERROR: SIGNING_STORE_PASSWORD is unavailable."
            exit 1
          fi

          echo "Testing JKS format..."

          keytool -list \
            -keystore "$RUNNER_TEMP/signing-key.p12" \
            -storetype JKS \
            -storepass "$STORE_PASS" \
            > "$RUNNER_TEMP/jks-result.txt" 2>&1

          JKS_RESULT=$?

          echo "Testing PKCS12 format..."

          keytool -list \
            -keystore "$RUNNER_TEMP/signing-key.p12" \
            -storetype PKCS12 \
            -storepass "$STORE_PASS" \
            > "$RUNNER_TEMP/p12-result.txt" 2>&1

          P12_RESULT=$?

          echo "--------------------------------"
          echo "JKS result: $JKS_RESULT"
          echo "PKCS12 result: $P12_RESULT"
          echo "--------------------------------"

          if [ "$JKS_RESULT" -eq 0 ]; then
            echo "DETECTED_FORMAT=JKS"
          elif [ "$P12_RESULT" -eq 0 ]; then
            echo "DETECTED_FORMAT=PKCS12"
          else
            echo "Neither format could be opened."
            echo "JKS diagnostic:"
            cat "$RUNNER_TEMP/jks-result.txt"
            echo "PKCS12 diagnostic:"
            cat "$RUNNER_TEMP/p12-result.txt"
            exit 1
          fi

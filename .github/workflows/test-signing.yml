
name: Test Organization Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-signing:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing-key.p12"
          test -s "$RUNNER_TEMP/signing-key.p12"
          echo "Keystore decoded successfully."

      - name: Verify keystore and private key
        env:
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASS"
          test -n "$KEY_PASS"
          test -n "$KEY_ALIAS"

          keytool -certreq \
            -alias "$KEY_ALIAS" \
            -keystore "$RUNNER_TEMP/signing-key.p12" \
            -storetype PKCS12 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -file "$RUNNER_TEMP/signing-test.csr"

          test -s "$RUNNER_TEMP/signing-test.csr"
          echo "SUCCESS: Keystore, alias and private key password verified."
